substitutions:
  _PROJECT_ID: "dev-env-368414"
  _IMAGE_TAG: "latest"
  _VM_NAME: "airflow-vm"
  _VM_ZONE: "europe-west1-b"
  _GCS_LOGGING_BUCKET: "airflow-vm1-loggings"

steps:
  # ============================================================
  # 1. Build de l’image
  # ============================================================
  - id: "build-airflow-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--tag"
      - "europe-west1-docker.pkg.dev/${_PROJECT_ID}/airflow/airflow:${_IMAGE_TAG}"
      - "--file"
      - "dockerfile"
      - "."

  # ============================================================
  # 2. Push vers Artifact Registry
  # ============================================================
  - id: "push-airflow-image"
    name: "gcr.io/cloud-builders/docker"
    waitFor:
      - "build-airflow-image"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/${_PROJECT_ID}/airflow/airflow:${_IMAGE_TAG}"

  # ============================================================
  # 3. Génération des variables de déploiement
  # ============================================================
  - id: "generate-deployment-environment"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "push-airflow-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        if [[ ! -f "/workspace/docker-compose.yml" ]]; then
          echo "Error: docker-compose.yml not found"
          exit 1
        fi

        cat > /workspace/env_vars.sh <<'EOF'
        #!/usr/bin/env bash

        export IMAGE_TAG="${_IMAGE_TAG}"
        export PROJECT_ID="${_PROJECT_ID}"
        export VM_NAME="${_VM_NAME}"
        export VM_ZONE="${_VM_ZONE}"
        export GCS_LOGGING_BUCKET="${_GCS_LOGGING_BUCKET}"
        export AIRFLOW_WEBSERVER_SECRET_KEY="ta-cle-generee"
        EOF

        chmod 600 /workspace/env_vars.sh

        echo "Deployment environment generated successfully"

  # ============================================================
  # 4. Préparation du répertoire distant
  # ============================================================
  - id: "prepare-airflow-vm"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "generate-deployment-environment"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        mkdir -p "$${HOME}/.ssh"
        chmod 700 "$${HOME}/.ssh"

        touch "$${HOME}/.ssh/google_compute_known_hosts"
        chmod 600 "$${HOME}/.ssh/google_compute_known_hosts"

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            mkdir -p "/home/cloud-build/deploy"
            chmod 700 "/home/cloud-build/deploy"
          '

        echo "Remote deployment directory prepared"

  # ============================================================
  # 5. Copie du Compose et des variables
  # ============================================================
  - id: "copy-deployment-files"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "prepare-airflow-vm"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute scp \
          /workspace/env_vars.sh \
          /workspace/docker-compose.yml \
          "${_VM_NAME}:/home/cloud-build/deploy/" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet

        echo "Deployment files copied successfully"
    # ============================================================
  # 6. Installation de Docker sur la VM si nécessaire
  # ============================================================
  - id: "install-docker-on-vm"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "copy-deployment-files"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            source /etc/os-release

            echo "Operating system: $${PRETTY_NAME}"

            case "$${ID}" in
              ubuntu|debian)
                ;;
              *)
                echo "Error: unsupported operating system: $${ID}"
                exit 1
                ;;
            esac

            # Si Docker et Compose sont déjà disponibles, ne rien réinstaller
            if command -v docker >/dev/null 2>&1 &&
               sudo docker compose version >/dev/null 2>&1; then

              echo "Docker and Docker Compose are already installed"
              sudo systemctl enable --now docker
              exit 0
            fi

            echo "Installing Docker prerequisites..."

            sudo apt-get update

            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y \
                ca-certificates \
                curl \
                jq

            echo "Adding the official Docker repository..."

            sudo install -m 0755 -d /etc/apt/keyrings

            curl -fsSL \
              "https://download.docker.com/linux/$${ID}/gpg" |
              sudo tee /etc/apt/keyrings/docker.asc \
                >/dev/null

            sudo chmod a+r /etc/apt/keyrings/docker.asc

            DOCKER_CODENAME="$${UBUNTU_CODENAME:-$${VERSION_CODENAME}}"
            DOCKER_ARCH="$$(dpkg --print-architecture)"

            echo \
              "deb [arch=$${DOCKER_ARCH} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/$${ID} $${DOCKER_CODENAME} stable" |
              sudo tee /etc/apt/sources.list.d/docker.list \
                >/dev/null

            sudo apt-get update

            echo "Installing Docker Engine and Docker Compose..."

            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y \
                docker-ce \
                docker-ce-cli \
                containerd.io \
                docker-buildx-plugin \
                docker-compose-plugin

            echo "Starting Docker..."

            sudo systemctl enable --now docker

            echo "Validating Docker installation..."

            sudo docker version
            sudo docker compose version

            echo "Docker installed successfully"
          '

  # ============================================================
  # 7. Validation de Docker, Compose, curl et jq
  # ============================================================
  - id: "validate-airflow-vm"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "install-docker-on-vm"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            command -v curl >/dev/null ||
              { echo "Error: curl is not installed"; exit 1; }

            command -v jq >/dev/null ||
              { echo "Error: jq is not installed"; exit 1; }

            sudo docker version >/dev/null ||
              { echo "Error: Docker is unavailable"; exit 1; }

            if sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin detected"
            elif sudo docker-compose version >/dev/null 2>&1; then
              echo "Legacy docker-compose detected"
            else
              echo "Error: Docker Compose is not installed"
              exit 1
            fi

            test -f "/home/cloud-build/deploy/env_vars.sh"
            test -f "/home/cloud-build/deploy/docker-compose.yml"

            chmod 600 "/home/cloud-build/deploy/env_vars.sh"
            chmod 600 "/home/cloud-build/deploy/docker-compose.yml"
          '

        echo "VM validation completed successfully"

  # ============================================================
  # 8. Authentification à Artifact Registry
  # ============================================================
  - id: "authenticate-artifact-registry"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "validate-airflow-vm"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            echo "Retrieving temporary token from VM metadata"

            ACCESS_TOKEN="$$(curl -fsS \
              --connect-timeout 5 \
              --max-time 15 \
              -H "Metadata-Flavor: Google" \
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" |
              jq -r ".access_token")"

            if [[ -z "$$ACCESS_TOKEN" || "$$ACCESS_TOKEN" == "null" ]]; then
              unset ACCESS_TOKEN
              echo "Error: unable to retrieve access token"
              exit 1
            fi

            if printf "%s" "$$ACCESS_TOKEN" |
              sudo docker login \
                --username oauth2accesstoken \
                --password-stdin \
                "europe-west1-docker.pkg.dev"; then

              echo "Docker authentication succeeded"
            else
              unset ACCESS_TOKEN
              echo "Error: Docker authentication failed"
              exit 1
            fi

            unset ACCESS_TOKEN
          '

  # ============================================================
  # 9. Nettoyage des ressources Docker inutilisées
  # ============================================================
  - id: "clean-docker-resources"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "authenticate-artifact-registry"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            sudo docker image prune -af || true
            sudo docker builder prune -f || true
            sudo docker network prune -f || true
          '

        echo "Docker cleanup completed"

  # ============================================================
  # 10. Pull de la nouvelle image
  # ============================================================
  - id: "pull-airflow-image"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "clean-docker-resources"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            source "/home/cloud-build/deploy/env_vars.sh"

            IMAGE_URI="europe-west1-docker.pkg.dev/$${PROJECT_ID}/airflow/airflow:$${IMAGE_TAG}"

            echo "Pulling $${IMAGE_URI}"

            if ! sudo docker pull "$${IMAGE_URI}"; then
              sudo docker logout \
                "europe-west1-docker.pkg.dev" \
                >/dev/null 2>&1 || true

              echo "Error: Docker image pull failed"
              exit 1
            fi

            echo "Docker image pulled successfully"
          '

  # ============================================================
  # 11. Démarrage ou mise à jour d’Airflow
  # ============================================================
  - id: "start-airflow-services"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "pull-airflow-image"
    entrypoint: "bash"
    volumes:
      - name: "ssh-config"
        path: "/builder/home/.ssh"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -Eeuo pipefail

            source "/home/cloud-build/deploy/env_vars.sh"

            cleanup_registry_authentication() {
              sudo docker logout \
                "europe-west1-docker.pkg.dev" \
                >/dev/null 2>&1 || true
            }

            # Si Compose échoue, Docker sera quand même déconnecté.
            trap cleanup_registry_authentication EXIT

            if sudo docker compose version >/dev/null 2>&1; then
              sudo -E docker compose \
                --project-directory "/home/cloud-build/deploy" \
                -f "/home/cloud-build/deploy/docker-compose.yml" \
                up -d --remove-orphans
            else
              sudo -E docker-compose \
                --project-directory "/home/cloud-build/deploy" \
                -f "/home/cloud-build/deploy/docker-compose.yml" \
                up -d --remove-orphans
            fi

            echo "Airflow services started successfully"
          '

timeout: "1600s"

options:
  logging: "CLOUD_LOGGING_ONLY"
