substitutions:
  _PROJECT_ID: "dev-env-368414"
  _IMAGE_TAG: "latest"
  _VM_NAME: "airflow-vm"
  _VM_ZONE: "europe-west1-b"
  _GCS_LOGGING_BUCKET: "airflow-vm1-loggings"

steps:
  # ============================================================
  # Step 0: Build de l'image Airflow
  # ============================================================
  - id: "build-airflow-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--tag"
      - "europe-west1-docker.pkg.dev/${_PROJECT_ID}/airflow/airflow:${_IMAGE_TAG}"
      - "--file"
      - "dockerfile"
      - "."

  # ============================================================
  # Step 1: Push vers Artifact Registry
  # ============================================================
  - id: "push-airflow-image"
    name: "gcr.io/cloud-builders/docker"
    waitFor:
      - "build-airflow-image"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/${_PROJECT_ID}/airflow/airflow:${_IMAGE_TAG}"

  # ============================================================
  # Step 2: Déploiement sur la VM avec OS Login
  # ============================================================
  - id: "deploy-to-airflow-vm"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    waitFor:
      - "push-airflow-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        echo "Preparing SSH environment..."

        # HOME du conteneur Cloud Build, pas celui de la VM
        mkdir -p "$${HOME}/.ssh"
        chmod 700 "$${HOME}/.ssh"

        touch "$${HOME}/.ssh/google_compute_known_hosts"
        chmod 600 "$${HOME}/.ssh/google_compute_known_hosts"

        echo "Generating env_vars.sh..."

        # Création locale du fichier qui sera transféré sur la VM
        cat > /workspace/env_vars.sh <<EOF
        #!/usr/bin/env bash

        export IMAGE_TAG="${_IMAGE_TAG}"
        export PROJECT_ID="${_PROJECT_ID}"
        export VM_NAME="${_VM_NAME}"
        export VM_ZONE="${_VM_ZONE}"
        export GCS_LOGGING_BUCKET="${_GCS_LOGGING_BUCKET}"
        EOF

        chmod 600 /workspace/env_vars.sh

        echo "Creating remote deployment directory..."

        # OS Login détermine automatiquement l'utilisateur Linux.
        # $$HOME sera évalué sur la VM.
        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -e
            mkdir -p "$$HOME/deploy"
          '

        echo "Copying deployment files..."

        gcloud compute scp \
          update-airflow.sh \
          /workspace/env_vars.sh \
          "${_VM_NAME}:~/deploy/" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet

        echo "Running Airflow deployment..."

        gcloud compute ssh "${_VM_NAME}" \
          --project="${_PROJECT_ID}" \
          --zone="${_VM_ZONE}" \
          --quiet \
          --command='
            set -euo pipefail

            chmod 700 "$$HOME/deploy/update-airflow.sh"
            chmod 600 "$$HOME/deploy/env_vars.sh"

            source "$$HOME/deploy/env_vars.sh"

            sudo env \
              IMAGE_TAG="$$IMAGE_TAG" \
              PROJECT_ID="$$PROJECT_ID" \
              VM_NAME="$$VM_NAME" \
              VM_ZONE="$$VM_ZONE" \
              GCS_LOGGING_BUCKET="$$GCS_LOGGING_BUCKET" \
              bash "$$HOME/deploy/update-airflow.sh"
          '

        echo "Deployment completed successfully."

timeout: "1600s"

options:
  logging: "CLOUD_LOGGING_ONLY"