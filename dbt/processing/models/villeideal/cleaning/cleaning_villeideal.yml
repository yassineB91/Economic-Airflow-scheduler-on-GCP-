  - name: cities_cleaning_hauts_de_seine
    description: "cleaning and formatting cities data"
    columns:
      - name: city
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

  - name: cities_cleaning_val_de_marne
    description: "cleaning and formatting cities data"
    columns:
      - name: city
        description: "The primary key for this table"
        tests:
          - unique
          - not_null


  - name: cities_cleaning_paris
    description: "cleaning and formatting cities data"
    columns:
      - name: city
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

  - name: cities_cleaning_seine_saint_denis
    description: "cleaning and formatting cities data"
