
version: 2

sources:
  - name: raw_cities
    database: "{{ var('source_project', target.project) }}"
    schema: villeideal
    tables:
      - name: yvelines
      - name: essone
      - name: seine_et_marne
      - name: seine_saint_denis
      - name: hauts_de_seine
      - name: paris
      - name: val_de_marne
      - name: val_doise




models:
  - name: cities_cleaning_val_doise
    description: "cleaning and formatting cities data"
    columns:
      - name: city
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

  # - name: cities_cleaning_yvelines
