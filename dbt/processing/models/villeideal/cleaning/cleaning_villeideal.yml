  - name: cities_cleaning_essone
    description: "cleaning and formatting cities data"
    columns:
      - name: city
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

exposures:
  - name: villeideal_dashboard
    type: dashboard
    maturity: low

    depends_on:
